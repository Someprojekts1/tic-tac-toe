<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .preview-link {
            display: block;
            text-decoration: none;
            transition: transform 0.2s;
            padding: 20px;
        }
        .preview-link:hover {
            transform: scale(1.02);
        }
        .board-container {
            background: #f8f9fc;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            border: 2px solid #e5e7eb;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .board-container h2 {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            color: #1a1a2e;
            font-size: 1em;
            font-weight: 400;
            margin-bottom: 20px;
            color: #9ca3af;
            letter-spacing: 1px;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 380px;
            margin: 0 auto;
        }
        .cell {
            aspect-ratio: 1;
            background: #ffffff;
            border: 2px solid #e5e7eb;
            border-radius: 16px;
            font-size: 4em;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a1a2e;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }
        .cell.x {
            color: #2563eb;
        }
        .cell.o {
            color: #dc2626;
        }
        .hint {
            margin-top: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            color: #d1d5db;
            font-size: 0.8em;
        }
    </style>
</head>
<body>
<a class="preview-link" href="/">
    <div class="board-container">
        <h2>🎮 Tic-Tac-Toe</h2>
        <div class="board">
            <div class="cell x">X</div>
            <div class="cell o">O</div>
            <div class="cell x">X</div>
            <div class="cell o">O</div>
            <div class="cell x">X</div>
            <div class="cell o">O</div>
            <div class="cell x">X</div>
            <div class="cell o">O</div>
            <div class="cell x">X</div>
        </div>
        <div class="hint">⬇️ Klicken zum Spielen</div>
    </div>
</a>
</body>
</html>
