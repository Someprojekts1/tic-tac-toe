<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 3.2em;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }
        .subtitle {
            color: #9ca3af;
            font-size: 1em;
            margin-bottom: 40px;
        }
        .consent-box {
            background: #f8f9fc;
            border: 2px solid #e5e7eb;
            border-radius: 24px;
            padding: 50px 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
            transition: all 0.3s;
        }
        .consent-box:hover {
            border-color: #d1d5db;
        }
        .consent-box h2 {
            font-size: 1.5em;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 30px;
        }
        .consent-btn {
            background: #1a1a2e;
            color: #ffffff;
            border: none;
            padding: 16px 48px;
            border-radius: 60px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            max-width: 380px;
            letter-spacing: 0.3px;
        }
        .consent-btn:hover {
            background: #2d2d44;
            transform: scale(1.01);
            box-shadow: 0 8px 25px rgba(26, 26, 46, 0.15);
        }
        .consent-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .consent-status {
            margin-top: 16px;
            font-size: 0.95em;
            color: #10b981;
            min-height: 28px;
        }
        .consent-status.error {
            color: #ef4444;
        }
        .footer-links {
            margin-top: 30px;
            text-align: left;
            font-size: 0.85em;
        }
        .footer-links a {
            color: #9ca3af;
            text-decoration: none;
            transition: color 0.2s;
            border-bottom: 1px dashed #e5e7eb;
            padding-bottom: 2px;
        }
        .footer-links a:hover {
            color: #6b7280;
        }
        .game-section {
            display: none;
            margin-top: 20px;
        }
        .game-section.active {
            display: block;
        }
        .status {
            font-size: 1.3em;
            font-weight: 500;
            color: #1a1a2e;
            margin-bottom: 20px;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 380px;
            margin: 0 auto 24px;
        }
        .cell {
            aspect-ratio: 1;
            background: #f8f9fc;
            border: 2px solid #e5e7eb;
            border-radius: 16px;
            font-size: 3.8em;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #1a1a2e;
            transition: all 0.2s;
        }
        .cell:hover {
            background: #f1f3f5;
            border-color: #d1d5db;
        }
        .cell.x { color: #2563eb; }
        .cell.o { color: #dc2626; }
        .reset-btn {
            background: #f3f4f6;
            color: #1a1a2e;
            border: 1px solid #e5e7eb;
            padding: 10px 32px;
            border-radius: 40px;
            font-size: 0.95em;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .reset-btn:hover {
            background: #e5e7eb;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🎮 Tic-Tac-Toe</h1>
    <p class="subtitle">Spiele gegen einen Freund</p>
    <div class="consent-box" id="consentBox">
        <h2>✋ Zustimmung erforderlich</h2>
        <button class="consent-btn" id="consentBtn">✅ Ich stimme zu und möchte spielen</button>
        <div class="consent-status" id="consentStatus"></div>
    </div>
    <div class="game-section" id="gameSection">
        <div class="status" id="status">Spieler X ist dran</div>
        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
        <button class="reset-btn" onclick="resetGame()">🔄 Neues Spiel</button>
    </div>
    <div class="footer-links">
        <a href="/einwilligung" target="_blank">📋 Datenschutz & Einwilligung</a>
    </div>
</div>
<script>
    const consentBtn = document.getElementById('consentBtn');
    const consentBox = document.getElementById('consentBox');
    const gameSection = document.getElementById('gameSection');
    const consentStatus = document.getElementById('consentStatus');
    consentBtn.addEventListener('click', async function() {
        consentBtn.disabled = true;
        consentBtn.textContent = '⏳ Wird gesendet...';
        try {
            const response = await fetch('/send-ip', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            });
            const result = await response.json();
            if (result.status === 'success') {
                consentStatus.textContent = '✅ Einwilligung erfolgreich! Viel Spaß!';
                consentStatus.classList.remove('error');
                consentBox.style.display = 'none';
                gameSection.classList.add('active');
            } else {
                consentStatus.textContent = '❌ Fehler. Bitte versuche es später.';
                consentStatus.classList.add('error');
                consentBtn.disabled = false;
                consentBtn.textContent = '✅ Ich stimme zu und möchte spielen';
            }
        } catch (error) {
            consentStatus.textContent = '❌ Verbindungsfehler. Bitte versuche es später.';
            consentStatus.classList.add('error');
            consentBtn.disabled = false;
            consentBtn.textContent = '✅ Ich stimme zu und möchte spielen';
        }
    });
    let board = ['', '', '', '', '', '', '', '', ''];
    let currentPlayer = 'X';
    let gameActive = true;
    const statusDisplay = document.getElementById('status');
    const cells = document.querySelectorAll('.cell');
    function checkWinner() {
        const winPatterns = [
            [0,1,2], [3,4,5], [6,7,8],
            [0,3,6], [1,4,7], [2,5,8],
            [0,4,8], [2,4,6]
        ];
        for (let pattern of winPatterns) {
            const [a,b,c] = pattern;
            if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                return board[a];
            }
        }
        return board.includes('') ? null : 'Unentschieden';
    }
    function handleCellClick(e) {
        const index = e.target.dataset.index;
        if (!gameActive || board[index] !== '') return;
        board[index] = currentPlayer;
        e.target.textContent = currentPlayer;
        e.target.classList.add(currentPlayer.toLowerCase());
        const result = checkWinner();
        if (result) {
            gameActive = false;
            if (result === 'Unentschieden') {
                statusDisplay.textContent = '🤝 Unentschieden!';
            } else {
                statusDisplay.textContent = `🎉 Spieler ${result} hat gewonnen!`;
            }
            return;
        }
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        statusDisplay.textContent = `Spieler ${currentPlayer} ist dran`;
    }
    function resetGame() {
        board = ['', '', '', '', '', '', '', '', ''];
        currentPlayer = 'X';
        gameActive = true;
        statusDisplay.textContent = 'Spieler X ist dran';
        cells.forEach(cell => {
            cell.textContent = '';
            cell.classList.remove('x', 'o');
        });
    }
    cells.forEach(cell => cell.addEventListener('click', handleCellClick));
</script>
</body>
</html>
